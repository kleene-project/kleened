name: Build pkg-packages and create release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build pkgs for FreeBSD 14.5 and 15.1 with Poudriere
    timeout-minutes: 60
    # Needed when creating releases.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # cache-after-prepare bakes poudriere, both build jails and the ports
      # tree into the cached image, so the slow setup below runs once. The
      # cache key hashes the one-line prepare text; bump '# v2' when changing
      # what poudriere-prepare.sh leaves in the image.
      - name: Build pkgs with Poudriere
        id: kleened-pkg-build
        uses: vmactions/freebsd-vm@v1
        with:
          release: '15.1'
          cache-after-prepare: true
          prepare: sh .github/scripts/poudriere-prepare.sh # v2
          run: sh .github/scripts/poudriere-build.sh

      - name: Upload pkg artifacts
        uses: actions/upload-artifact@v7
        with:
          name: kleened_pkgs
          path: pkg_out/*.pkg

      - name: Attach pkgs to the Kleened release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: pkg_out/*.pkg

  test:
    runs-on: ubuntu-latest
    needs: build
    name: Test kleened pkg package
    timeout-minutes: 45
    steps:
      # The klee suite is tested against the klee branch with the same name as
      # the kleened branch under test when one exists, and against klee's main
      # otherwise (with a visible warning).
      - name: Probe for a klee twin branch
        id: klee_ref
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            branch="${{ github.head_ref }}"
          elif [ "${{ github.ref_type }}" = "branch" ]; then
            branch="${{ github.ref_name }}"
          else
            branch=""
          fi
          if [ -n "$branch" ] \
             && git ls-remote --heads https://github.com/kleene-project/klee.git "$branch" | grep -q .; then
            echo "ref=$branch" >> "$GITHUB_OUTPUT"
            echo "::notice::klee twin branch '$branch' found; testing klee at it."
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
            echo "::warning title=no klee twin branch::Branch '$branch' has no klee twin; running klee suite at main."
          fi

      - name: Export klee ref for the VM
        run: echo "KLEE_REF=${{ steps.klee_ref.outputs.ref }}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v8
        with:
          name: kleened_pkgs

      # Same prepared image as run_tests.yml (identical one-line prepare text
      # means the same cache key): toolchain, zroot pool, basejail and the
      # test-jail tarball.
      - name: Test the built package in a FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: '15.1'
          envs: 'KLEE_REF'
          cache-after-prepare: true
          prepare: sh .github/scripts/vm-prepare-tests.sh # v2
          run: |
            set -eu
            # The pkg ABI major must match the 15.1 VM; the freebsd14 build is
            # validated by its own in-jail poudriere testport/bulk above.
            pkg install -y ./kleened-*-freebsd15-amd64.pkg

            sh .github/scripts/vm-reset-kleene.sh

            sysrc kleened_enable=yes
            # Exercises the rc script shipped in the pkg.
            service kleened init
            service kleened start

            n=0
            until sockstat -l | grep -q /var/run/kleened.sock; do
              n=$((n + 1))
              if [ "$n" -gt 60 ]; then
                echo "kleened did not listen on /var/run/kleened.sock within 60s"
                tail -50 /var/log/kleened.log
                exit 1
              fi
              sleep 1
            done

            sh .github/scripts/vm-klee-suite.sh
