name: Run Kleened and Klee test suites

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    name: Running Kleened and Klee test-suites
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v7

    # The klee suite is tested against the klee branch with the same name as
    # this kleened branch when one exists, and against klee's main otherwise
    # (with a visible warning). Kleened-only branches still get full CI.
    - name: Probe for a klee twin branch
      id: klee_ref
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          branch="${{ github.head_ref }}"
        elif [ "${{ github.ref_type }}" = "branch" ]; then
          branch="${{ github.ref_name }}"
        else
          branch=""
        fi
        if [ -n "$branch" ] \
           && git ls-remote --heads https://github.com/kleene-project/klee.git "$branch" | grep -q .; then
          echo "ref=$branch" >> "$GITHUB_OUTPUT"
          echo "::notice::klee twin branch '$branch' found; testing klee at it."
        else
          echo "ref=main" >> "$GITHUB_OUTPUT"
          echo "::warning title=no klee twin branch::Branch '$branch' has no klee twin; running klee suite at main."
        fi

    - name: Export klee ref for the VM
      run: echo "KLEE_REF=${{ steps.klee_ref.outputs.ref }}" >> "$GITHUB_ENV"

    # Boots the VM and runs prepare inside it. cache-after-prepare bakes the
    # prepared image (packages, zroot pool, basejail, test-jail tarball) into
    # the cache; the key hashes the one-line prepare text below. When changing
    # what vm-prepare-tests.sh leaves in the image, bump the '# v2' comment.
    # copyback is off: this workflow produces no host-side artifacts, and the
    # per-step pull-back would drag _build/ to the runner after every step.
    - name: Boot FreeBSD 15.1 VM and prepare it
      id: kleened-testing
      uses: vmactions/freebsd-vm@v1
      with:
        release: '15.1'
        envs: 'KLEE_REF'
        copyback: false
        cache-after-prepare: true
        prepare: sh .github/scripts/vm-prepare-tests.sh # v2

    - name: Reset kleene state and configure host
      shell: freebsd {0}
      run: set -eu; sh .github/scripts/vm-reset-kleene.sh

    - name: Run Kleened-tests
      shell: freebsd {0}
      run: set -eu; sh .github/scripts/vm-kleened-suite.sh

    # Back to a pristine state before the klee suite: it asserts on ZFS
    # dataset totals, so images left by the ExUnit run fail unrelated tests.
    # Destroying the datasets also clears kleened's SQLite metadata.
    - name: Reset kleene state for the klee suite
      shell: freebsd {0}
      run: set -eu; sh .github/scripts/vm-reset-kleene.sh

    - name: Build Kleened release and start daemon
      shell: freebsd {0}
      run: set -eu; sh .github/scripts/vm-start-daemon.sh

    - name: Run Klee-tests
      shell: freebsd {0}
      run: set -eu; sh .github/scripts/vm-klee-suite.sh

    - name: Show Kleened host information
      if: failure()
      shell: freebsd {0}
      run: set -eu; sh .github/scripts/vm-diagnostics.sh
